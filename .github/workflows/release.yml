name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package, e.g. 0.1.1
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Package
        run: sh scripts/package.sh
        env:
          AMORA_VERSION: ${{ env.TAG }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          dmg="dist/Amora-${version}-arm64.dmg"
          notes="Download Amora-${version}-arm64.dmg for Apple Silicon.

          Open the disk image and drag Amora into Applications. Amora is unsigned, so the first time you open it, Control-click Amora, choose Open, then choose Open again. After that, the paw icon appears in the menu bar.

          Requires macOS 14 or later. Swift and Xcode are not required."
          # Releases created in the GitHub UI already exist when the tag push arrives.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" --clobber
          else
            gh release create "$TAG" "$dmg" --title "Amora $version" --notes "$notes"
          fi
